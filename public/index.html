<script>

async function compress(file,max=1000){const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});
 const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);

function auth(mode='up'){
 if(me)return go('/painel');
 let legacy=false;
 const passwordOk=p=>/^(?=(?:.*\\d){6}$)(?=.*[A-Z])[A-Za-z0-9]{7}$/.test(p);
 const normalizePhone=value=>{let p=String(value||'').trim().replace(/[\\s().-]/g,'');if(p.startsWith('00'))p='+'+p.slice(2);if(/^\\d{8,15}$/.test(p))p='+'+p;return p};
 function render(){
  const signup=mode==='up', oldLogin=!signup&&legacy;
  app.innerHTML='<div class="card" style="max-width:460px;margin:10px auto">'+
   '<div class="tabs"><button class="'+(signup?'on':'')+'" id="tu" type="button">Criar conta</button><button class="'+(!signup?'on':'')+'" id="ti" type="button">Entrar</button></div>'+

   '<p class="small muted">'+(signup?'Registe-se com o seu nome e número de telefone.':'Entre para gerir os seus produtos, serviços e pedidos.')+'</p>'+
   (oldLogin?'<label>Email da conta antiga</label><input id="em" type="email" autocomplete="email" placeholder="nome@email.com">':(signup?'<label>Nome completo</label><input id="nm" type="text" autocomplete="name" maxlength="80" placeholder="O seu nome">':'')+'<label>Telefone com indicativo do país</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="+258 84 123 4567"><p class="small muted" style="margin:5px 0">Use o formato internacional, por exemplo +258, +55, +244 ou +351.</p>')+
   '<label>Senha</label><input id="pw" type="password" autocomplete="'+(signup?'new-password':'current-password')+'" maxlength="'+(oldLogin?'128':'7')+'" '+(oldLogin?'':'inputmode="text" autocapitalize="characters"')+' placeholder="'+(oldLogin?'A sua senha':'6 números + 1 letra maiúscula')+'">'+
   (signup?'<p class="small muted" style="margin:5px 0">A senha deve ter exactamente 7 caracteres: 6 números e 1 letra maiúscula.</p>':'')+
   '<button class="btn w" id="ok" style="margin-top:16px" type="button">'+(signup?'Criar conta': 'Entrar')+'</button>'+
   (signup?'<p class="small muted" style="text-align:center">A criação e utilização da loja são grátis durante o lançamento.</p>':'')+
   (oldLogin?'<p class="small muted" style="text-align:center"><a href="#" id="newLogin">Voltar ao acesso por telefone</a></p>':(!signup?'<p class="small muted" style="text-align:center"><a href="#" id="oldLogin">Tenho uma conta antiga? Entrar com email</a></p>':''))+
   '<p class="small muted" style="text-align:center;margin:14px 0 4px">'+(signup?'Já tens uma conta? <a href="/entrar?modo=entrar" data-l><b>Entrar</b></a>':'Ainda não tens conta? <a href="/entrar?modo=criar" data-l><b>Criar conta</b></a>')+'</p>'+
   '<a href="/explorar" data-l class="btn o w" style="margin-top:8px">Continuar como visitante</a></div>';
  $('#tu').onclick=()=>auth('up');$('#ti').onclick=()=>auth('in');
  const old=$('#oldLogin');if(old)old.onclick=e=>{e.preventDefault();legacy=true;render()};
  const newer=$('#newLogin');if(newer)newer.onclick=e=>{e.preventDefault();legacy=false;render()};
  $('#ok').onclick=async()=>{
   const btn=$('#ok');btn.disabled=true;btn.textContent=signup?'A criar conta…':'A entrar…';
   try{
    const password=$('#pw').value;
    if(!oldLogin&&!passwordOk(password)){toast('A senha deve ter 6 números e 1 letra maiúscula, totalizando 7 caracteres.');return}
    let result;
    if(oldLogin){
     const email=$('#em').value.trim();if(!email){toast('Introduza o email da sua conta antiga.');return}
     result=await sb.auth.signInWithPassword({email,password});
    }else{
     const phone=normalizePhone($('#ph').value);
     if(!/^\\+[1-9]\\d{7,14}$/.test(phone)){toast('Introduza o telefone com indicativo internacional, por exemplo +258…');return}
     if(signup){
      const name=$('#nm').value.trim();if(name.length<2){toast('Introduza o seu nome completo.');return}
      result=await sb.auth.signUp({phone,password,options:{data:{full_name:name,name}}});
     }else result=await sb.auth.signInWithPassword({phone,password});
    }
    if(result.error){
     const m=result.error.message||'Não foi possível continuar.';
     if(/provider.*not enabled|phone.*disabled|unsupported.*phone/i.test(m))toast('O acesso por telefone ainda precisa de ser activado em Supabase → Authentication → Sign In / Providers → Phone.');

  };

function storeForm(s){
 const n=!s;s=s||{name:'',slug:'',whatsapp:'',currency:'USD',description:'',logo_url:'',cover_url:'',social_links:{},delivery:true,pickup:true,delivery_fee:0};
 const oldDelivery=s.delivery!==false,oldPickup=s.pickup!==false;
 const mode=!oldDelivery&&!oldPickup?'booking':oldDelivery&&oldPickup?'both':oldDelivery?'delivery':'pickup';
 let logo=null,cover=null;history.replaceState({},'','/painel');
 app.innerHTML=`<h1>${n?'Vamos criar a sua loja':'Perfil da loja'}</h1><p class="small muted">Podes adicionar ou actualizar as redes sociais agora ou voltar a esta página pelo painel da tua loja.</p><div class="card">
 <label>Nome do negócio</label><input id="n" value="${esc(s.name)}" placeholder="Ex.: Barbearia do Paulo">
 <label>Link da loja</label><div class="row" style="flex-wrap:nowrap;gap:4px"><span class="muted small" style="flex:0 0 auto">fumacraft.pages.dev/</span><input id="sl" value="${esc(s.slug)}" placeholder="barbearia-do-paulo"></div>
 <label>WhatsApp (com código do país)</label><input id="w" value="${esc(s.whatsapp)}" inputmode="tel" placeholder="Ex.: 258 84 123 4567">
 <div class="row"><div><label>Moeda</label><select id="c">${Object.keys(CUR).map(k=>`<option ${k===s.currency?'selected':''}>${k}</option>`).join('')}</select></div><div><label>Taxa de entrega</label><input id="fee" type="number" min="0" step="0.01" value="${s.delivery_fee||0}"></div></div>
 <label>Descrição</label><textarea id="d" rows="2" placeholder="O que vende ou serviço que presta, horário e zona de atendimento">${esc(s.description)}</textarea>
 <h3 style="margin:18px 0 4px">🌐 Redes sociais e comunidade</h3><p class="small muted">Todos os links são opcionais. Adicione os perfis oficiais da sua loja e, se tiver, o link do grupo.</p>
 <label>Instagram · Link do perfil</label><input id="ig" type="url" value="${esc(s.social_links?.instagram||'')}" placeholder="https://instagram.com/sualoja">
 <label>Facebook · Link da página/perfil</label><input id="fb" type="url" value="${esc(s.social_links?.facebook||'')}" placeholder="https://facebook.com/sualoja">
 <label>TikTok · Link do perfil</label><input id="tt" type="url" value="${esc(s.social_links?.tiktok||'')}" placeholder="https://tiktok.com/@sualoja">
 <label>Telegram · Link do perfil/canal</label><input id="tg" type="url" value="${esc(s.social_links?.telegram||'')}" placeholder="https://t.me/sualoja">
 <label>Grupo da loja · Link de convite</label><input id="grp" type="url" value="${esc(s.social_links?.group||'')}" placeholder="https://chat.whatsapp.com/... ou https://t.me/...">
 ${picker('lg','Logo',s.logo_url,false,'🏪')}${picker('cv','Foto de capa',s.cover_url,true,'🖼️')}
 <label>Como atende os clientes?</label><select id="mode">
  <option value="both" ${mode==='both'?'selected':''}>Entrega e levantamento</option>
  <option value="delivery" ${mode==='delivery'?'selected':''}>Só entrega</option>
  <option value="pickup" ${mode==='pickup'?'selected':''}>Atendimento no local / levantamento</option>
  <option value="booking" ${mode==='booking'?'selected':''}>Serviços por marcação (ex.: barbearia, salão, consultório)</option>
 </select>
 <p class="small muted">Em serviços por marcação, o cliente envia uma preferência de dia e hora. Tu confirmas a disponibilidade directamente no WhatsApp.</p>
 <button class="btn w" id="sv" style="margin-top:18px">${n?'Criar loja grátis':'Guardar'}</button></div>`;
 let touched=!!s.slug;$('#sl').oninput=()=>touched=true;$('#n').oninput=()=>{if(!touched)$('#sl').value=slugify($('#n').value)};
 bindPicker('lg',f=>logo=f);bindPicker('cv',f=>cover=f);
 $('#sv').onclick=async()=>{const b=$('#sv'),m=$('#mode').value;
  const o={name:$('#n').value.trim(),slug:slugify($('#sl').value||$('#n').value),whatsapp:$('#w').value.replace(/\D/g,''),currency:$('#c').value,
   delivery_fee:Math.max(0,+$('#fee').value||0),description:$('#d').value.trim(),social_links:{instagram:$('#ig').value.trim(),facebook:$('#fb').value.trim(),tiktok:$('#tt').value.trim(),telegram:$('#tg').value.trim(),group:$('#grp').value.trim()},delivery:m==='both'||m==='delivery',pickup:m==='both'||m==='pickup'};
  if(!o.name)return toast('Escreva o nome do negócio');
  for(const [label,value] of Object.entries({Instagram:o.social_links.instagram,Facebook:o.social_links.facebook,TikTok:o.social_links.tiktok,Telegram:o.social_links.telegram,'Grupo da loja':o.social_links.group})){if(value){try{const u=new URL(value);if(!['http:','https:'].includes(u.protocol))throw 0;o.social_links[label==='Instagram'?'instagram':label==='Facebook'?'facebook':label==='TikTok'?'tiktok':label==='Telegram'?'telegram':'group']=u.href}catch{return toast('Link inválido em '+label+'. Use um endereço https:// válido.')}}}
  if(o.slug.length<3||RESERVED.includes(o.slug))return toast('Escolha outro link');
  if(o.whatsapp.length<8||o.whatsapp.length>15)return toast('WhatsApp inválido. Inclua o código do país.');
  if(m==='booking')o.delivery=false,o.pickup=false;
  b.disabled=true;b.textContent='A guardar…';
  try{if(logo)o.logo_url=await upload(logo,me.id,'logo');if(cover)o.cover_url=await upload(cover,me.id,'cover');
   const r=n?await sb.from('stores').insert({...o,owner:me.id}):await sb.from('stores').update(o).eq('id',s.id);
   if(r.error){if(r.error.code==='23505')throw new Error('Este link já existe, escolha outro');if(/social_links/i.test(r.error.message||''))throw new Error('A actualização da base de dados ainda não foi aplicada. Os links sociais só poderão ser guardados depois dessa etapa.');throw r.error}
   toast(n?'Loja criada! 🎉':'Guardado');panel();
  }catch(e){toast(e.message||'Erro');b.disabled=false;b.textContent='Tentar de novo'}
 };
}
function productForm(s,p){const n=!p;p=p||{name:'',price:'',description:'',category:'',photo_url:'',active:true};let ph=null;const serviceOnly=s.delivery===false&&s.pickup===false;
 app.innerHTML=`<h1>${n?(serviceOnly?'Novo serviço':'Novo produto'):(serviceOnly?'Editar serviço':'Editar produto')}</h1><div class="card">${picker('pf',serviceOnly?'Foto do serviço':'Foto do produto',p.photo_url,false)}
<label>${serviceOnly?'Nome do serviço':'Nome'}</label><input id="pn" value="${esc(p.name)}" placeholder="${serviceOnly?'Ex.: Corte masculino':'Ex.: Camisa azul'}">
<div class="row"><div><label>Preço (${s.currency})</label><input id="pp" type="number" min="0" step="0.01" value="${p.price}"></div><div><label>Categoria</label><input id="pc" value="${esc(p.category)}" placeholder="Ex.: Bolos"></div></div>
<label>Descrição</label><textarea id="pd" rows="3">${esc(p.description)}</textarea>
<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pa" ${p.active?'checked':''} style="width:20px;height:20px"> Visível na loja</label>
<button class="btn w" id="ps" style="margin-top:14px">Guardar produto</button>${n?'':'<button class="btn r w" id="px" style="margin-top:10px">Apagar produto</button>'}
<button class="btn o w" id="pb" style="margin-top:10px">← Voltar sem guardar</button></div>`;
 bindPicker('pf',f=>ph=f);$('#pb').onclick=panel;
 $('#ps').onclick=async()=>{const b=$('#ps');const o={name:$('#pn').value.trim(),price:parseFloat($('#pp').value),category:$('#pc').value.trim(),description:$('#pd').value.trim(),active:$('#pa').checked};
  if(!o.name||!(o.price>=0))return toast('Preencha nome e preço');b.disabled=true;b.textContent='A guardar…';
  try{if(ph)o.photo_url=await upload(ph,me.id,'p');const r=n?await sb.from('products').insert({...o,store_id:s.id}):await sb.from('products').update(o).eq('id',p.id);if(r.error)throw r.error;toast('Produto guardado');panel()}
  catch(e){toast(e.message||'Erro');b.disabled=false;b.textContent='Tentar de novo'}};
 const x=$('#px');if(x)x.onclick=async()=>{if(!confirm('Apagar este produto?'))return;await sb.from('products').delete().eq('id',p.id);toast('Apagado');panel()};}



async function sellerAnalytics(days=30){
 app.innerHTML='<div class="spin"></div>';
 const r=await sb.rpc('seller_analytics',{p_days:days});
 if(r.error){app.innerHTML='<div class="card"><h2>Não foi possível carregar as análises</h2><p class="muted">'+esc(r.error.message)+'</p><button class="btn o" id="ab">Voltar ao painel</button></div>';$('#ab').onclick=()=>panel();return}
 const a=r.data||{},top=a.top_products||[],daily=a.daily||[];
 const sr=await sb.from('stores').select('currency').eq('owner',me.id).maybeSingle(),currency=sr.data?.currency||'USD';
 const card=(t,v)=>'<div class="card" style="text-align:center"><div class="small muted">'+t+'</div><b style="font-size:25px">'+v+'</b></div>';
 app.innerHTML='<div class="row" style="justify-content:space-between"><h1>📊 Análises da loja</h1><button class="btn s o" id="ab">← Voltar</button></div><div class="card"><label>Período</label><select id="sd"><option value="7">Últimos 7 dias</option><option value="30" '+(days===30?'selected':'')+'>Últimos 30 dias</option><option value="90" '+(days===90?'selected':'')+'>Últimos 90 dias</option></select></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:12px">'+card('Visualizações da loja',a.store_views||0)+card('Visualizações de produtos',a.product_views||0)+card('Adições ao carrinho',a.add_to_cart||0)+card('Pedidos recebidos',a.orders||0)+card('Vendas registadas',fmt(+a.revenue||0,currency))+'</div><div class="card" style="margin-top:14px"><h3>🏆 Produtos mais vendidos</h3>'+(top.length?top.map(p=>'<div class="li"><div><b>'+esc(p.name)+'</b><div class="small muted">'+p.units_sold+' unidades vendidas · '+p.views+' visualizações</div></div></div>').join(''):'<p class="muted">Ainda não há dados de vendas ou visualizações neste período.</p>')+'</div><div class="card" style="margin-top:14px"><h3>📈 Actividade diária</h3>'+daily.map(x=>'<div class="li"><span>'+esc(x.day)+'</span><span class="small muted">'+x.views+' visualizações · '+x.orders+' pedidos</span></div>').join('')+'</div><p class="small muted">As estatísticas começam a ser recolhidas a partir da activação desta funcionalidade. Os dados antigos não são recuperados.</p>';
 $('#ab').onclick=()=>panel();$('#sd').onchange=e=>sellerAnalytics(+e.target.value);
}
async function loadAdminAnalytics(days=30){

async function admin(){

  sb.rpc('admin_my_permissions'),sb.rpc('admin_stores'),sb.rpc('admin_users_count'),
  sb.rpc('admin_list_users'),sb.rpc('admin_list_orders'),sb.rpc('admin_list_products'),sb.rpc('admin_list_admin_members')
 ]);
 const pr=rs[0],sr=rs[1],cr=rs[2],ur=rs[3],or=rs[4],productsR=rs[5],ar=rs[6];
 if(pr.error&&!sr.error){

  fallback+='<a class="btn o w" href="/painel" data-l>Voltar</a>';app.innerHTML=fallback;return;
 }

 if(!Object.values(perms).some(Boolean)){app.innerHTML='<div class="card"><h2>Sem permissões</h2><p class="muted">A tua conta não tem permissões para aceder ao painel administrativo.</p><a class="btn o" href="/painel" data-l>Voltar à minha loja</a></div>';return}
 const stores=sr.error?[]:(sr.data||[]),users=ur.error?[]:(ur.data||[]),orders=or.error?[]:(or.data||[]),products=productsR.error?[]:(productsR.data||[]),staff=ar.error?[]:(ar.data||[]);
 const root=!ar.error;let page='overview',query='';if(!can('dashboard.view'))page=can('stores.view')?'stores':can('users.view')?'users':can('orders.view')?'orders':'products';

 function render(){

// Preferência visual guardada neste dispositivo.
(function(){
 const root=document.documentElement;
 const saved=localStorage.getItem('fumacraft-theme')||'light';
 root.dataset.theme=saved;
 function paint(){const b=document.getElementById('themeToggle');if(b){b.textContent=root.dataset.theme==='dark'?'☀':'☾';b.title=root.dataset.theme==='dark'?'Mudar para tema claro':'Mudar para tema escuro';b.setAttribute('aria-label',b.title)}}
 document.addEventListener('click',function(e){if(e.target.closest('#themeToggle')){root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem('fumacraft-theme',root.dataset.theme);paint()}});
 paint();
})();

if('serviceWorker' in navigator){
 window.addEventListener('load',async()=>{
  try{
   const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'});
   reg.update().catch(()=>{});
   document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
   setInterval(()=>reg.update().catch(()=>{}),5*60*1000);
   let refreshing=false;
   navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;refreshing=true;window.location.reload();
   });
  }catch(e){console.warn('Fumacraft update check:',e)}
 });
}
</script>
