const orderLabel=o=>o.mode==='marcacao'?({novo:'🟡 Marcação solicitada',pronto:'✅ Marcação confirmada',entregue:'🟢 Atendimento concluído'}[o.status]||o.status):(stLabel[o.status]||o.status);
async function loadOrders(s){const el=$('#ol');if(!el)return;const {data}=await sb.from('orders').select('*').eq('store_id',s.id).order('created_at',{ascending:false}).limit(10);
 el.innerHTML=(data||[]).map(o=>`<div class="li" data-oc="${o.code}" style="cursor:pointer"><span><b style="letter-spacing:2px">${o.code}</b> · ${esc(o.customer||'')}<br><span class="small muted">${new Date(o.created_at).toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'})} · ${orderLabel(o)}</span></span><b>${fmt(o.total,s.currency)}</b></div>`).join('')||'<p class="small muted">Ainda não há pedidos.</p>';
 el.querySelectorAll('[data-oc]').forEach(d=>d.onclick=()=>openOrder(s,d.dataset.oc));}
async function openOrder(s,raw){let c=String(raw||'').trim();const m=c.match(/pedido=([A-Za-z0-9]+)/);if(m)c=m[1];c=c.toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<4)return toast('Escreva o código do pedido');
 const {data:o}=await sb.from('orders').select('*').eq('store_id',s.id).eq('code',c).maybeSingle();if(!o)return toast('Pedido '+c+' não encontrado');
 const booking=o.mode==='marcacao',status=orderLabel(o),next=o.status==='novo'?'pronto':o.status==='pronto'?'entregue':null;
 const action=booking?(o.status==='novo'?'Confirmar marcação':'Marcar atendimento concluído'):(o.status==='novo'?'Marcar pronto':'Marcar entregue');
 const md=document.createElement('div');md.className='modal';md.innerHTML=`<div class="sheet"><div class="small muted">${booking?'Pedido de marcação':'Pedido'}</div><h2 style="margin:0 0 4px;letter-spacing:4px">${o.code}</h2><div>${status} · ${esc(o.customer||'')}</div>
<div class="card" style="margin-top:10px">${o.items.map(i=>`<div class="li"><span>${i.qty}× ${esc(i.name)}</span><b>${fmt(i.price*i.qty,s.currency)}</b></div>`).join('')}
<div class="li"><span>${booking?'📅 Marcação':o.mode==='entrega'?'🛵 Entrega':'🏪 Levantamento'}</span><b>${o.fee?fmt(o.fee,s.currency):'Grátis'}</b></div><div class="li" style="border:0"><b>Total</b><b>${fmt(o.total,s.currency)}</b></div></div>
${o.address?`<p class="small">${booking?'🕒 Preferência de dia/hora:':'📍 '}${esc(o.address)}</p>`:''}${o.note?`<p class="small">📝 ${esc(o.note)}</p>`:''}
<div class="row" style="margin-top:12px">${next?`<button class="btn" data-st="${next}">${action}</button>`:''}<button class="btn r" id="xd">Apagar</button><button class="btn o" id="xc">Fechar</button></div></div>`;
 document.body.appendChild(md);md.onclick=e=>{if(e.target===md)md.remove()};md.querySelector('#xc').onclick=()=>md.remove();md.querySelector('#xd').onclick=async()=>{if(!confirm('Apagar o pedido '+o.code+'?'))return;const e=(await sb.from('orders').delete().eq('id',o.id)).error;if(e)return toast(e.message);md.remove();toast('Pedido apagado');loadOrders(s)};
 const b=md.querySelector('[data-st]');if(b)b.onclick=async()=>{b.disabled=true;const e=(await sb.from('orders').update({status:b.dataset.st}).eq('id',o.id)).error;if(e)return toast(e.message);md.remove();toast('Atualizado');loadOrders(s)};
}
function loadJsQR(){return window.jsQR?Promise.resolve():new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)})}
async function scanQR(cb){const md=document.createElement('div');md.className='modal';md.innerHTML=`<div class="sheet" style="text-align:center"><h3 style="margin-top:0">Aponte para o QR do cliente</h3><video playsinline muted style="width:100%;border-radius:12px;background:#000"></video><button class="btn o w" style="margin-top:10px">Fechar</button></div>`;document.body.appendChild(md);
 const v=md.querySelector('video');let stream,on=true;const stop=()=>{on=false;stream&&stream.getTracks().forEach(t=>t.stop());md.remove()};md.querySelector('button').onclick=stop;
 try{await loadJsQR();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play()}catch(e){stop();return toast('Não foi possível abrir a câmara. Escreva o código.')}
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 const tick=()=>{if(!on)return;if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(r&&r.data){stop();return cb(r.data)}}requestAnimationFrame(tick)};tick();}

/* ===== EXPLORE ===== */
async function explore(){document.title='Explorar lojas · Fumacraft';app.innerHTML='<div class="spin"></div>';
 const [{data:ss},{data:pp}]=await Promise.all([sb.from('stores').select('id,slug,name,description,logo_url,cover_url,currency,plan,trial_started,paid_until'),sb.from('products').select('id,name,price,photo_url,category,store_id').eq('active',true).limit(300)]);
 const st=(ss||[]),byId=Object.fromEntries(st.map(s=>[s.id,s]));const ps=(pp||[]).filter(p=>byId[p.store_id]);
 const mine=JSON.parse(localStorage.getItem('fc_orders')||'[]');let q='';
 const draw=()=>{const t=q.toLowerCase();const S=st.filter(s=>!t||(s.name+' '+(s.description||'')).toLowerCase().includes(t));const P=ps.filter(p=>!t||(p.name+' '+(p.category||'')).toLowerCase().includes(t));
  $('#er').innerHTML=`<h2>Lojas (${S.length})</h2><div class="grid p">${S.map(s=>`<a class="card prod" href="/${esc(s.slug)}" data-l style="text-decoration:none;color:inherit">${s.cover_url?`<img class="thumb" src="${esc(s.cover_url)}" loading="lazy" alt="">`:s.logo_url?`<img class="thumb" src="${esc(s.logo_url)}" loading="lazy" alt="">`:`<div class="thumb ph" style="font-size:34px">${esc(s.name.trim()[0].toUpperCase())}</div>`}<h3>${esc(s.name)}</h3>${s.description?`<div class="small muted">${esc(s.description.slice(0,70))}</div>`:''}</a>`).join('')||'<p class="muted">Nenhuma loja encontrada.</p>'}</div>
${t?`<h2>Produtos (${P.length})</h2><div class="grid p">${P.slice(0,60).map(p=>`<a class="card prod" href="/${esc(byId[p.store_id].slug)}" data-l style="text-decoration:none;color:inherit">${p.photo_url?`<img class="thumb" src="${esc(p.photo_url)}" loading="lazy" alt="">`:`<div class="thumb ph" style="font-size:34px">${esc(p.name.trim()[0].toUpperCase())}</div>`}<h3>${esc(p.name)}</h3><div class="price">${fmt(p.price,byId[p.store_id].currency)}</div><div class="small muted">${esc(byId[p.store_id].name)}</div></a>`).join('')||'<p class="muted">Nenhum produto encontrado.</p>'}</div>`:''}`;};
 app.innerHTML=`<h1 style="margin:6px 0">🔎 Explorar</h1><p class="muted" style="margin-top:0">Encontre lojas, produtos e serviços. Escolha o que procura e fale directamente com o negócio.</p>
<input id="eq" placeholder="O que procura? Ex.: bolo, sapatos, corte de cabelo…" style="font-size:18px;padding:14px">
${mine.length?`<details style="margin-top:12px"><summary>🔑 Os meus códigos de pedido (${mine.length})</summary>${mine.map(o=>`<div class="li"><span><b style="letter-spacing:2px">${esc(o.code)}</b> · ${esc(o.store)}</span><span>${esc(o.total)}</span></div>`).join('')}</details>`:''}
<div id="er"></div>`;
 const e=$('#eq');e.oninput=()=>{q=e.value;draw()};draw();}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
