async function compress(file,max=1000){const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)});
 const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.82));}

 return sb.storage.from('images').getPublicUrl(path).data.publicUrl;}

<input id="pph" inputmode="numeric" maxlength="9" placeholder="Número, ex.: 84XXXXXXX" value="${esc(localStorage.getItem('fc_payphone')||'')}"><button class="btn w" id="ppg" style="margin-top:8px">Pagar ${PAGAR_PRICE}</button><div id="pps" class="small" style="margin-top:6px"></div></div>`;
 el.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{m=b.dataset.pm;el.querySelectorAll('[data-pm]').forEach(x=>x.classList.toggle('on',x===b))});
 $('#ppg').onclick=async()=>{const ph=$('#pph').value.replace(/\D/g,'');if(!/^8[2-7]\d{7}$/.test(ph))return toast('Número com 9 dígitos, ex.: 84XXXXXXX');localStorage.setItem('fc_payphone',ph);
  const g=$('#ppg'),s=$('#pps');g.disabled=true;g.textContent='A enviar…';
  const r=await sb.functions.invoke('pagar-pay',{body:{method:m,phone:ph}});let d=r.data;if(r.error){try{d=await r.error.context.json()}catch(e){}}
  if(!d?.reference){g.disabled=false;g.textContent='Pagar '+PAGAR_PRICE;s.textContent='❌ '+(d?.error||'Não foi possível iniciar o pagamento.');return}
  s.textContent='📲 Confirme o pagamento com o seu PIN no telemóvel…';g.textContent='A aguardar confirmação…';
  const t0=Date.now();const poll=async()=>{const q=await sb.functions.invoke('pagar-pay',{body:{action:'status',reference:d.reference}});const st=q.data?.status;
   if(st==='PAID'){toast('Pagamento confirmado! Loja ativa por 30 dias');return panel()}
   if(['FAILED','CANCELLED'].includes(st)||Date.now()-t0>240000){g.disabled=false;g.textContent='Tentar de novo';s.textContent='❌ '+(q.data?.message||'Pagamento não concluído.');return}
   setTimeout(poll,10000+Math.random()*3000)};setTimeout(poll,8000);};}

/* ===== INSTALL + NOTIFICATIONS ===== */
let instEv=null;const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
function instBtn(){if(standalone()||localStorage.getItem('fc_noinst'))return;if(!instEv&&!isIOS)return;if($('#ib'))return;
 const b=document.createElement('div');b.id='ib';b.style.cssText='position:fixed;left:12px;right:12px;bottom:14px;z-index:60;background:#16201b;color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:520px;margin:0 auto';
 b.innerHTML=`<img src="/icon-192.png" width="40" height="40" style="border-radius:10px"><div style="flex:1;font-size:14px"><b>Instalar Fumacraft</b><br><span style="opacity:.8">${isIOS&&!instEv?'Toque em Partilhar e depois “Adicionar ao ecrã principal”':'Abra a sua loja como uma app'}</span></div>${instEv?'<button class="btn s y" id="ibg" style="flex:0 0 auto">Instalar</button>':''}<button id="ibx" style="background:none;border:0;color:#fff;font-size:20px;flex:0 0 auto" aria-label="Fechar">×</button>`;
 document.body.appendChild(b);$('#ibx').onclick=()=>{localStorage.setItem('fc_noinst','1');b.remove()};
 const g=$('#ibg');if(g)g.onclick=async()=>{instEv.prompt();const r=await instEv.userChoice;instEv=null;b.remove();if(r.outcome==='accepted')toast('Fumacraft instalado!')};}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;instBtn()});
addEventListener('appinstalled',()=>{$('#ib')?.remove()});
setTimeout(instBtn,4000);
let rtCh=null;
async function notify(t,b,url){try{const r=await navigator.serviceWorker?.getRegistration();if(r)return r.showNotification(t,{body:b,icon:'/icon-192.png',badge:'/icon-192.png',data:{url},tag:'fc-'+Date.now()});new Notification(t,{body:b,icon:'/icon-192.png'})}catch(e){}}
function listenOrders(s){if(rtCh||!('Notification' in window))return;
 rtCh=sb.channel('orders-'+s.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'orders',filter:'store_id=eq.'+s.id},p=>{const o=p.new;
  if(Notification.permission==='granted')notify('🛍️ Novo pedido '+o.code,(o.customer||'Cliente')+' · '+fmt(o.total,s.currency),'/painel?pedido='+o.code);
  toast('Novo pedido '+o.code);loadOrders(s)}).subscribe();}
function notifBox(s){listenOrders(s);const el=$('#nb');if(!el||!('Notification' in window))return;
 if(Notification.permission==='default'){el.innerHTML=`<div class="banner" style="margin-top:10px">🔔 Ative as notificações para saber logo quando chega um pedido.<br><button class="btn s" id="nbo" style="margin-top:8px">Permitir notificações</button></div>`;
  $('#nbo').onclick=async()=>{const r=await Notification.requestPermission();if(r==='granted'){toast('Notificações ativadas');notify('Fumacraft','As notificações de pedidos estão ativas ✅','/painel')}else toast('Notificações bloqueadas. Pode ativá-las nas definições do navegador.');notifBox(s)}}
 else if(Notification.permission==='denied')el.innerHTML='<p class="small muted" style="margin-top:8px">🔕 Notificações bloqueadas. Ative nas definições do navegador para este site.</p>';
 else el.innerHTML='<p class="small muted" style="margin-top:8px">🔔 Notificações de pedidos ativas.</p>';}

/* ===== ORDERS (seller) ===== */
const stLabel={novo:'🟡 Novo',pronto:'🔵 Pronto',entregue:'🟢 Entregue'};
async function loadOrders(s){const el=$('#ol');if(!el)return;const {data}=await sb.from('orders').select('*').eq('store_id',s.id).order('created_at',{ascending:false}).limit(10);
 el.innerHTML=(data||[]).map(o=>`<div class="li" data-oc="${o.code}" style="cursor:pointer"><span><b style="letter-spacing:2px">${o.code}</b> · ${esc(o.customer||'')}<br><span class="small muted">${new Date(o.created_at).toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'})} · ${stLabel[o.status]||o.status}</span></span><b>${fmt(o.total,s.currency)}</b></div>`).join('')||'<p class="small muted">Ainda não há pedidos.</p>';
 el.querySelectorAll('[data-oc]').forEach(d=>d.onclick=()=>openOrder(s,d.dataset.oc));}
async function openOrder(s,raw){let c=String(raw||'').trim();const m=c.match(/pedido=([A-Za-z0-9]+)/);if(m)c=m[1];c=c.toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<4)return toast('Escreva o código do pedido');
 const {data:o}=await sb.from('orders').select('*').eq('store_id',s.id).eq('code',c).maybeSingle();if(!o)return toast('Pedido '+c+' não encontrado');
 const md=document.createElement('div');md.className='modal';md.innerHTML=`<div class="sheet"><div class="small muted">Pedido</div><h2 style="margin:0 0 4px;letter-spacing:4px">${o.code}</h2><div>${stLabel[o.status]||o.status} · ${esc(o.customer||'')}</div>
<div class="card" style="margin-top:10px">${o.items.map(i=>`<div class="li"><span>${i.qty}× ${esc(i.name)}</span><b>${fmt(i.price*i.qty,s.currency)}</b></div>`).join('')}
<div class="li"><span>${o.mode==='entrega'?'🛵 Entrega':'🏪 Levantamento'}</span><b>${o.fee?fmt(o.fee,s.currency):'Grátis'}</b></div><div class="li" style="border:0"><b>Total</b><b>${fmt(o.total,s.currency)}</b></div></div>
${o.address?`<p class="small">📍 ${esc(o.address)}</p>`:''}${o.note?`<p class="small">📝 ${esc(o.note)}</p>`:''}
<div class="row" style="margin-top:12px">${o.status!=='entregue'?`<button class="btn" data-st="${o.status==='novo'?'pronto':'entregue'}">${o.status==='novo'?'Marcar pronto':'Marcar entregue'}</button>`:''}<button class="btn o" id="xc">Fechar</button></div></div>`;
 document.body.appendChild(md);md.onclick=e=>{if(e.target===md)md.remove()};md.querySelector('#xc').onclick=()=>md.remove();
 const b=md.querySelector('[data-st]');if(b)b.onclick=async()=>{b.disabled=true;const e=(await sb.from('orders').update({status:b.dataset.st}).eq('id',o.id)).error;if(e)return toast(e.message);md.remove();toast('Atualizado');loadOrders(s)};}
function loadJsQR(){return window.jsQR?Promise.resolve():new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)})}
async function scanQR(cb){const md=document.createElement('div');md.className='modal';md.innerHTML=`<div class="sheet" style="text-align:center"><h3 style="margin-top:0">Aponte para o QR do cliente</h3><video playsinline muted style="width:100%;border-radius:12px;background:#000"></video><button class="btn o w" style="margin-top:10px">Fechar</button></div>`;document.body.appendChild(md);
 const v=md.querySelector('video');let stream,on=true;const stop=()=>{on=false;stream&&stream.getTracks().forEach(t=>t.stop());md.remove()};md.querySelector('button').onclick=stop;
 try{await loadJsQR();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play()}catch(e){stop();return toast('Não foi possível abrir a câmara. Escreva o código.')}
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 const tick=()=>{if(!on)return;if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);if(r&&r.data){stop();return cb(r.data)}}requestAnimationFrame(tick)};tick();}

/* ===== EXPLORE ===== */
async function explore(){document.title='Explorar lojas · Fumacraft';app.innerHTML='<div class="spin"></div>';
 const [{data:ss},{data:pp}]=await Promise.all([sb.from('stores').select('id,slug,name,description,logo_url,cover_url,currency,plan,trial_started,paid_until'),sb.from('products').select('id,name,price,photo_url,category,store_id').eq('active',true).limit(300)]);
 const st=(ss||[]).filter(isLive),byId=Object.fromEntries(st.map(s=>[s.id,s]));const ps=(pp||[]).filter(p=>byId[p.store_id]);
 const mine=JSON.parse(localStorage.getItem('fc_orders')||'[]');let q='';
 const draw=()=>{const t=q.toLowerCase();const S=st.filter(s=>!t||(s.name+' '+(s.description||'')).toLowerCase().includes(t));const P=ps.filter(p=>!t||(p.name+' '+(p.category||'')).toLowerCase().includes(t));
  $('#er').innerHTML=`<h2>Lojas (${S.length})</h2><div class="grid p">${S.map(s=>`<a class="card prod" href="/${esc(s.slug)}" data-l style="text-decoration:none;color:inherit">${s.cover_url?`<img class="thumb" src="${esc(s.cover_url)}" loading="lazy" alt="">`:s.logo_url?`<img class="thumb" src="${esc(s.logo_url)}" loading="lazy" alt="">`:`<div class="thumb ph" style="font-size:34px">${esc(s.name.trim()[0].toUpperCase())}</div>`}<h3>${esc(s.name)}</h3>${s.description?`<div class="small muted">${esc(s.description.slice(0,70))}</div>`:''}</a>`).join('')||'<p class="muted">Nenhuma loja encontrada.</p>'}</div>
${t?`<h2>Produtos (${P.length})</h2><div class="grid p">${P.slice(0,60).map(p=>`<a class="card prod" href="/${esc(byId[p.store_id].slug)}" data-l style="text-decoration:none;color:inherit">${p.photo_url?`<img class="thumb" src="${esc(p.photo_url)}" loading="lazy" alt="">`:`<div class="thumb ph" style="font-size:34px">${esc(p.name.trim()[0].toUpperCase())}</div>`}<h3>${esc(p.name)}</h3><div class="price">${fmt(p.price,byId[p.store_id].currency)}</div><div class="small muted">${esc(byId[p.store_id].name)}</div></a>`).join('')||'<p class="muted">Nenhum produto encontrado.</p>'}</div>`:''}`;};
 app.innerHTML=`<h1 style="margin:6px 0">🔎 Explorar</h1><p class="muted" style="margin-top:0">Encontre lojas e produtos perto de si e faça o pedido pelo WhatsApp.</p>
<input id="eq" placeholder="O que procura? Ex.: bolo, sapatos, frango…" style="font-size:18px;padding:14px">
${mine.length?`<details style="margin-top:12px"><summary>🔑 Os meus códigos de pedido (${mine.length})</summary>${mine.map(o=>`<div class="li"><span><b style="letter-spacing:2px">${esc(o.code)}</b> · ${esc(o.store)}</span><span>${esc(o.total)}</span></div>`).join('')}</details>`:''}
<div id="er"></div>`;
 const e=$('#eq');e.oninput=()=>{q=e.value;draw()};draw();}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
